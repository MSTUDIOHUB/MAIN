[package]
name = "tauri-app"
version = "2.3.3"
description = "MAIN desktop app"
authors = ["you"]
edition = "2021"
default-run = "tauri-app"

[[bin]]
name = "tauri-app"
path = "src/main.rs"

[[bin]]
name = "main"
path = "src/bin/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glob = "0.3"
regex = "1"
walkdir = "2"
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
url = "2"

# ── Architecture Spec §1 Backend Requirements ──────────────────────────
# Context-limit token counting
tiktoken-rs = "0.6"
# Embedded PTY for the Terminal panel
portable-pty = "0.8"
# HTTP client for cloud endpoint connectivity test, model discovery & streaming (bypasses CORS)
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "io-util", "process", "rt", "sync", "time"] }
# System memory info for VRAM pressure estimation
sysinfo = "0.34"
# Protocol Package ZIP extraction
zip = "2.3"
tempfile = "3"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
rusqlite = { version = "0.40.0", features = ["bundled"] }
tree-sitter = "0.26.11"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-go = "0.25.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSImage", "NSResponder", "NSWorkspace", "std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSData", "NSString", "std"] }
security-framework = "3.7.0"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-window-state = "2.4.1"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
