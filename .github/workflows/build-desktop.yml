name: Build Desktop Packages

on:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-14
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Generate app icons
        run: npm run icon:app

      - name: Build macOS package
        shell: bash
        run: |
          if [[ -n "${APPLE_CERTIFICATE}" || -n "${APPLE_SIGNING_IDENTITY}" ]]; then
            npm run tauri build -- --target universal-apple-darwin --bundles app,dmg
          else
            npm run tauri build -- --target universal-apple-darwin --bundles app,dmg --no-sign
          fi

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MAIN-macos
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/macos/MAIN.app
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Generate app icons
        run: npm run icon:app

      - name: Build Windows portable package
        run: npm run build:windows:portable

      - name: Build Windows package
        run: npm run build:windows

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MAIN-windows
          path: |
            src-tauri/target/release/portable/*.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
