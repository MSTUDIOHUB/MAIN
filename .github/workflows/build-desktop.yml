name: Build and Publish Desktop Zips

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without leading v, for example 1.4.1"
        required: true
        type: string
      release_repo:
        description: "Public GitHub repo for release downloads"
        required: true
        default: "MSTUDIOHUB/MAIN-Releases"
        type: string
      update_repo:
        description: "Public GitHub repo for updater feed assets"
        required: true
        default: "MSTUDIOHUB/MAIN-UpdateFeed"
        type: string
      draft:
        description: "Create the public GitHub Release as a draft"
        required: true
        default: false
        type: boolean
      prerelease:
        description: "Mark the public GitHub Release as a pre-release"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  APP_NAME: MAIN

jobs:
  macos:
    name: Build macOS zip
    runs-on: macos-14
    env:
      VERSION: ${{ inputs.version }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Check updater signing secrets
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]]; then
            echo "::error::Missing TAURI_SIGNING_PRIVATE_KEY secret. Generate a Tauri updater key and add it to MAIN Actions secrets."
            exit 1
          fi

          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD}" ]]; then
            echo "::error::Missing TAURI_SIGNING_PRIVATE_KEY_PASSWORD secret. Add the updater key password to MAIN Actions secrets."
            exit 1
          fi

      - name: Sync release version
        run: npm run release:bump -- "$VERSION"

      - name: Generate app icons
        run: npm run icon:app

      - name: Build macOS universal app bundle
        shell: bash
        run: |
          if [[ -n "${APPLE_CERTIFICATE}" || -n "${APPLE_SIGNING_IDENTITY}" ]]; then
            npm run tauri build -- --target universal-apple-darwin --bundles app
          else
            npm run tauri build -- --target universal-apple-darwin --bundles app --no-sign
          fi

      - name: Build macOS Apple Silicon app bundle
        shell: bash
        run: |
          if [[ -n "${APPLE_CERTIFICATE}" || -n "${APPLE_SIGNING_IDENTITY}" ]]; then
            npm run tauri build -- --target aarch64-apple-darwin --bundles app
          else
            npm run tauri build -- --target aarch64-apple-darwin --bundles app --no-sign
          fi

      - name: Zip macOS app bundles
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-assets

          zip_app() {
            local app_path="$1"
            local zip_name="$2"

            test -d "$app_path"

            if [[ -z "${APPLE_CERTIFICATE}" && -z "${APPLE_SIGNING_IDENTITY}" ]]; then
              codesign --force --deep --sign - "$app_path"
              codesign --verify --deep --strict --verbose=2 "$app_path"
            fi

            ditto -c -k --sequesterRsrc --keepParent "$app_path" "release-assets/$zip_name"
          }

          zip_app \
            "src-tauri/target/universal-apple-darwin/release/bundle/macos/${APP_NAME}.app" \
            "${APP_NAME}_${VERSION}_macOS_universal.zip"

          zip_app \
            "src-tauri/target/aarch64-apple-darwin/release/bundle/macos/${APP_NAME}.app" \
            "${APP_NAME}_${VERSION}_macOS_apple_silicon.zip"

      - name: Collect macOS updater artifacts
        shell: bash
        run: |
          set -euo pipefail

          create_updater_artifact() {
            local app_path="$1"
            local platform_name="$2"
            local output_name="release-assets/${APP_NAME}_${VERSION}_updater_${platform_name}.app.tar.gz"

            if [[ ! -d "${app_path}" ]]; then
              echo "::error::Missing macOS app bundle: ${app_path}"
              exit 1
            fi

            tar -czf "${output_name}" -C "$(dirname "${app_path}")" "$(basename "${app_path}")"
            rm -f "${output_name}.sig"
            npx tauri signer sign "${output_name}"

            if [[ ! -f "${output_name}.sig" ]]; then
              echo "::error::Failed to sign macOS updater artifact: ${output_name}"
              exit 1
            fi
          }

          create_updater_artifact \
            "src-tauri/target/universal-apple-darwin/release/bundle/macos/${APP_NAME}.app" \
            "darwin_x86_64"

          create_updater_artifact \
            "src-tauri/target/aarch64-apple-darwin/release/bundle/macos/${APP_NAME}.app" \
            "darwin_aarch64"

          ls -lah release-assets

      - name: Upload macOS assets
        uses: actions/upload-artifact@v7
        with:
          name: main-macos-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Build Windows zip
    runs-on: windows-latest
    env:
      VERSION: ${{ inputs.version }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Check updater signing secrets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            Write-Error "Missing TAURI_SIGNING_PRIVATE_KEY secret. Generate a Tauri updater key and add it to MAIN Actions secrets."
          }

          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            Write-Error "Missing TAURI_SIGNING_PRIVATE_KEY_PASSWORD secret. Add the updater key password to MAIN Actions secrets."
          }

      - name: Sync release version
        run: npm run release:bump -- $env:VERSION

      - name: Build Windows portable package
        run: npm run build:windows:portable

      - name: Build Windows updater installer
        run: npm run tauri build -- --bundles nsis

      - name: Zip Windows portable package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $exePath = "src-tauri\target\release\portable\${env:APP_NAME}-${env:VERSION}-windows-portable.exe"
          $zipPath = "release-assets\${env:APP_NAME}_${env:VERSION}_windows_x64.zip"

          if (!(Test-Path $exePath)) {
            throw "Missing Windows portable exe: $exePath"
          }

          New-Item -ItemType Directory -Force -Path "release-assets" | Out-Null
          Compress-Archive -Path $exePath -DestinationPath $zipPath -Force

      - name: Collect Windows updater artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $nsisDir = "src-tauri\target\release\bundle\nsis"
          $artifact = Get-ChildItem -Path $nsisDir -Recurse -File -Filter "*.exe" |
            Where-Object { $_.Name -notlike "*.sig" } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if ($null -eq $artifact) {
            Get-ChildItem -Path $nsisDir -Recurse -File | ForEach-Object { Write-Host $_.FullName }
            throw "Missing Windows updater NSIS artifact under $nsisDir"
          }

          $outputPath = "release-assets\${env:APP_NAME}_${env:VERSION}_updater_windows_x86_64.exe"
          Copy-Item $artifact.FullName $outputPath -Force
          Remove-Item "$outputPath.sig" -Force -ErrorAction SilentlyContinue
          npx tauri signer sign $outputPath

          if (!(Test-Path "$outputPath.sig")) {
            throw "Failed to sign Windows updater artifact: $outputPath"
          }

          Get-ChildItem release-assets | Format-Table Name, Length

      - name: Upload Windows assets
        uses: actions/upload-artifact@v7
        with:
          name: main-windows-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish public release
    runs-on: ubuntu-latest
    needs:
      - macos
      - windows
    env:
      VERSION: ${{ inputs.version }}
      RELEASE_REPO: ${{ inputs.release_repo }}
      UPDATE_REPO: ${{ inputs.update_repo }}
      GH_TOKEN: ${{ secrets.PUBLIC_RELEASES_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          pattern: main-*-assets
          path: release-assets
          merge-multiple: true

      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail

          commit_sha="$(git rev-parse --short HEAD)"
          commit_subject="$(git log -1 --pretty=%s)"
          commit_body="$(git log -1 --pretty=%b)"
          commit_author="$(git log -1 --pretty='%an')"
          commit_date="$(git log -1 --date=iso-strict --pretty='%cd')"
          changed_files="$(git show --name-status --format= --find-renames HEAD)"

          {
            echo "# MAIN ${VERSION}"
            echo ""
            echo "## Downloads"
            echo ""
            echo "- macOS Universal: download \`${APP_NAME}_${VERSION}_macOS_universal.zip\`"
            echo "- macOS Apple Silicon: download \`${APP_NAME}_${VERSION}_macOS_apple_silicon.zip\`"
            echo "- Windows: download \`${APP_NAME}_${VERSION}_windows_x64.zip\`"
            echo ""
            echo "## Changelog"
            echo ""
            echo "- Commit: \`${commit_sha}\`"
            echo "- Author: ${commit_author}"
            echo "- Date: ${commit_date}"
            echo "- Summary: ${commit_subject}"

            if [[ -n "${commit_body}" ]]; then
              echo ""
              echo "### Commit details"
              echo ""
              echo '```text'
              printf '%s\n' "${commit_body}"
              echo '```'
            fi

            if [[ -n "${changed_files}" ]]; then
              echo ""
              echo "### Changed files"
              echo ""
              echo '```text'
              printf '%s\n' "${changed_files}"
              echo '```'
            fi

            echo ""
            echo "## Privacy boundary"
            echo ""
            echo "This public release contains only packaged desktop binaries and a commit summary. Source code remains in the private MAIN repository."
          } > release-assets/release-notes.md

          ls -lah release-assets

      - name: Generate updater manifest
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import pathlib
          import urllib.parse
          from datetime import datetime, timezone

          app_name = os.environ["APP_NAME"]
          version = os.environ["VERSION"]
          update_repo = os.environ["UPDATE_REPO"]
          tag = f"v{version}"
          assets_dir = pathlib.Path("release-assets")
          base_url = f"https://github.com/{update_repo}/releases/download/{tag}"

          def asset_url(file_name):
              return f"{base_url}/{urllib.parse.quote(file_name)}"

          def platform_entry(file_name):
              asset_path = assets_dir / file_name
              signature_path = assets_dir / f"{file_name}.sig"
              if not asset_path.is_file():
                  raise SystemExit(f"Missing updater asset: {asset_path}")
              if not signature_path.is_file():
                  raise SystemExit(f"Missing updater signature: {signature_path}")
              return {
                  "signature": signature_path.read_text(encoding="utf-8").strip(),
                  "url": asset_url(file_name),
              }

          darwin_x86_64 = platform_entry(f"{app_name}_{version}_updater_darwin_x86_64.app.tar.gz")
          darwin_aarch64 = platform_entry(f"{app_name}_{version}_updater_darwin_aarch64.app.tar.gz")
          windows_x86_64 = platform_entry(f"{app_name}_{version}_updater_windows_x86_64.exe")

          manifest = {
              "version": version,
              "notes": (assets_dir / "release-notes.md").read_text(encoding="utf-8"),
              "pub_date": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "platforms": {
                  "darwin-x86_64": darwin_x86_64,
                  "darwin-x86_64-app": darwin_x86_64,
                  "darwin-aarch64": darwin_aarch64,
                  "darwin-aarch64-app": darwin_aarch64,
                  "windows-x86_64": windows_x86_64,
                  "windows-x86_64-nsis": windows_x86_64,
              },
          }

          (assets_dir / "latest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          python3 -m json.tool release-assets/latest.json >/dev/null
          ls -lah release-assets/latest.json

      - name: Publish to public GitHub Releases repos
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${GH_TOKEN}" ]]; then
            echo "::error::Missing PUBLIC_RELEASES_TOKEN secret. Add a GitHub token that can write releases to ${RELEASE_REPO} and ${UPDATE_REPO}."
            exit 1
          fi

          tag="v${VERSION}"
          create_flags=()

          if [[ "${{ inputs.draft }}" == "true" ]]; then
            create_flags+=(--draft)
          fi

          if [[ "${{ inputs.prerelease }}" == "true" ]]; then
            create_flags+=(--prerelease)
          fi

          if gh release view "$tag" --repo "$RELEASE_REPO" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --repo "$RELEASE_REPO" \
              --title "${APP_NAME} ${VERSION}" \
              --notes-file release-assets/release-notes.md \
              --draft="${{ inputs.draft }}" \
              --prerelease="${{ inputs.prerelease }}"

            gh release delete-asset "$tag" SHA256SUMS.txt \
              --repo "$RELEASE_REPO" \
              --yes >/dev/null 2>&1 || true

            gh release upload "$tag" \
              release-assets/*.zip \
              --repo "$RELEASE_REPO" \
              --clobber
          else
            gh release create "$tag" \
              release-assets/*.zip \
              --repo "$RELEASE_REPO" \
              --title "${APP_NAME} ${VERSION}" \
              --notes-file release-assets/release-notes.md \
              "${create_flags[@]}"
          fi

          if gh release view "$tag" --repo "$UPDATE_REPO" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --repo "$UPDATE_REPO" \
              --title "${APP_NAME} Updater ${VERSION}" \
              --notes-file release-assets/release-notes.md \
              --draft="${{ inputs.draft }}" \
              --prerelease="${{ inputs.prerelease }}"

            gh release delete-asset "$tag" SHA256SUMS.txt \
              --repo "$UPDATE_REPO" \
              --yes >/dev/null 2>&1 || true

            gh release upload "$tag" \
              release-assets/*_updater_* \
              release-assets/latest.json \
              --repo "$UPDATE_REPO" \
              --clobber
          else
            gh release create "$tag" \
              release-assets/*_updater_* \
              release-assets/latest.json \
              --repo "$UPDATE_REPO" \
              --title "${APP_NAME} Updater ${VERSION}" \
              --notes-file release-assets/release-notes.md \
              "${create_flags[@]}"
          fi
