name: Bug 报告
description: 报告可以稳定复现的 MAIN 问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。安全漏洞请不要在这里公开，请改用 SECURITY.md 中的私密渠道。
  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 实际发生了什么？你期望发生什么？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 请提供最小、稳定、已去除密钥和个人数据的复现步骤。
      placeholder: |
        1. 打开……
        2. 配置……
        3. 发送……
        4. 观察到……
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MAIN 版本或 commit
      placeholder: 例如 2.3.3 或 commit SHA
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 操作系统
      options:
        - macOS Apple Silicon
        - macOS Intel
        - Windows x64
        - Linux / 其他源码构建
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Provider 与模型
      description: 如与模型无关可填写“不适用”；不要填写 API Key。
  - type: textarea
    id: evidence
    attributes:
      label: 日志与截图
      description: 只附与问题有关且已清除密钥、邮箱、路径和个人数据的内容。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，没有找到相同问题。
          required: true
        - label: 这不是未公开的安全漏洞。
          required: true
        - label: 我已从日志和截图中移除密钥与个人数据。
          required: true
