name: 功能建议
description: 提议一个对 MAIN 用户或 Agent 开发者有价值的改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请先描述用户目标和当前困难，而不只是实现方式。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望行为、成功标准和可能的替代方案。
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 主要领域
      options:
        - Provider / 模型兼容
        - Agent 循环 / 计划 / 恢复
        - 工具 / MCP / Skills
        - 权限 / Shell / 网络安全
        - UI / 交互 / 主题
        - Session / 持久化
        - Trace / Replay / Eval
        - 文档 / 社区
        - 其他
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: 风险与取舍
      description: 对本地模型、云端 Provider、权限、兼容性或维护成本有什么影响？
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue 和文档。
          required: true
        - label: 我愿意补充复现、设计或测试信息。
          required: true
